services:
  - type: web
    name: book-ocr
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    envVars:
      - key: OCR_ENGINE
        value: tesseract
      - key: OCR_DPI
        value: "200"
      - key: OCR_GRAYSCALE
        value: "1"
      - key: OMP_THREAD_LIMIT
        value: "1"
      - key: HUB_MODE
        value: "1"
      - key: HUB_TOKEN
        value: "kitab-hub"
      - key: PORT
        value: "8000"
